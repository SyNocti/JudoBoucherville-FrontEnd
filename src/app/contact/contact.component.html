<div class="contact-container">
    <!-- Page title section -->
    <section class="title-section">
        <app-page-title title="Nous contacter"></app-page-title>
    </section>

    <!-- Contact content section -->
    <section class="contact-section">
        <div class="container">

            <!-- Contact grid -->
            <div class="contact-grid">
                <!-- Contact Information -->
                <div class="contact-info-section">
                    <h3 class="section-title">Informations de contact</h3>

                    <div class="contact-methods">
                        <!-- Address -->
                        <div class="contact-item" (click)="openMap()">
                            <div class="contact-icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div class="contact-details">
                                <h4>Adresse</h4>
                                <p>490, chemin du Lac<br>Boucherville (Québec), J4B 6X3</p>
                            </div>
                            <div class="contact-action">
                                <i class="fas fa-external-link-alt"></i>
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="contact-item" (click)="callPhone()">
                            <div class="contact-icon">
                                <i class="fas fa-phone"></i>
                            </div>
                            <div class="contact-details">
                                <h4>Téléphone</h4>
                                <p>(450) 655-1888</p>
                            </div>
                            <div class="contact-action">
                                <i class="fas fa-phone-alt"></i>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="contact-item" (click)="sendEmail()">
                            <div class="contact-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="contact-details">
                                <h4>Courriel</h4>
                                <p>info&#64;judoboucherville.com</p>
                            </div>
                            <div class="contact-action">
                                <i class="fas fa-paper-plane"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Social Media -->
                    <div class="social-section">
                        <h3 class="section-title">Suivez-nous</h3>
                        <div class="social-links">
                            <a (click)="openSocialLink('facebook')" class="social-link facebook" aria-label="Facebook">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a (click)="openSocialLink('instagram')" class="social-link instagram"
                                aria-label="Instagram">
                                <i class="fab fa-instagram"></i>
                            </a>
                            <a (click)="openSocialLink('twitter')" class="social-link twitter" aria-label="X">
                                <i class="fab fa-x-twitter"></i>
                            </a>
                            <a (click)="openSocialLink('tiktok')" class="social-link tiktok" aria-label="TikTok">
                                <i class="fab fa-tiktok"></i>
                            </a>
                            <a (click)="openSocialLink('youtube')" class="social-link youtube" aria-label="YouTube">
                                <i class="fab fa-youtube"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Map Section -->
                <div class="map-section">
                    <h3 class="section-title">Localisation</h3>
                    <div class="map-container">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2805.3649285088546!2d-73.44516892344195!3d45.59122397107418!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cc91a5e8f5c9b0b%3A0x3d8e1e1f1c5f1c5f!2s490%20Chem.%20du%20Lac%2C%20Boucherville%2C%20QC%20J4B%206X3%2C%20Canada!5e0!3m2!1sen!2sca!4v1640995200000!5m2!1sen!2sca"
                            width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"
                            title="Localisation du Club de Judo Boucherville">
                        </iframe>
                    </div>
                    <div class="map-actions">
                        <button class="map-button" (click)="openMap()">
                            <i class="fas fa-directions"></i>
                            Obtenir les directions
                        </button>
                    </div>
                </div>
            </div>

            <!-- Additional Information -->
            <div class="additional-info">
                <h3 class="section-title">Heures d'ouverture</h3>
                <div class="hours-grid">
                    <div class="hours-item">
                        <span class="day">Lundi - Vendredi</span>
                        <span class="time">9h00 - 21h00</span>
                    </div>
                    <div class="hours-item">
                        <span class="day">Samedi</span>
                        <span class="time">9h00 - 19h00</span>
                    </div>
                    <div class="hours-item">
                        <span class="day">Dimanche</span>
                        <span class="time">Fermé</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
